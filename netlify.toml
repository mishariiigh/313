[build]
  command = "npm run build"
  publish = "dist_deploy"
  functions = "api"  
  
[build.environment]
  NODE_VERSION = "20.0.0" 
  NPM_FLAGS = "--legacy-peer-deps"
  VITE_API_URL = "/.netlify/functions"  

[dev]
  framework = "vite"
  targetPort = 3000
  autoLaunch = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
